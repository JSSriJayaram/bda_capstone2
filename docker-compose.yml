services:
    namenode:
        image: apache/hadoop:3.3.6
        platform: linux/amd64
        hostname: namenode
        container_name: taxi-namenode
        command: ["hdfs", "namenode"]
        ports:
            - "9871:9870"
            - "8022:8020"
        env_file: ./hadoop.env
        environment:
            - ENSURE_NAMENODE_DIR=/data/name/current
        volumes:
            - taxi_namenode_data:/data

    datanode:
        image: apache/hadoop:3.3.6
        platform: linux/amd64
        hostname: datanode
        container_name: taxi-datanode
        command: ["hdfs", "datanode"]
        env_file: ./hadoop.env
        depends_on:
            - namenode
        volumes:
            - taxi_datanode_data:/data

    resourcemanager:
        image: apache/hadoop:3.3.6
        platform: linux/amd64
        hostname: resourcemanager
        container_name: taxi-resourcemanager
        command: ["yarn", "resourcemanager"]
        ports:
            - "8089:8088"
        env_file: ./hadoop.env
        depends_on:
            - namenode
            - datanode

    nodemanager:
        image: apache/hadoop:3.3.6
        platform: linux/amd64
        hostname: nodemanager
        container_name: taxi-nodemanager
        command: ["yarn", "nodemanager"]
        env_file: ./hadoop.env
        depends_on:
            - resourcemanager

    hive-server:
        image: apache/hive:3.1.3
        platform: linux/amd64
        hostname: hive-server
        container_name: taxi-hive-server
        env_file: ./hadoop.env
        depends_on:
            - namenode
            - datanode
            - resourcemanager
            - nodemanager
        environment:
            SERVICE_NAME: metastore
            IS_RESUME: "false"
        volumes:
            - ./hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml
            - ./hive/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
            - ./hive/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
            - ./hive/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
            - ./hive/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
            - ./hive/taxi_analytics.sql:/tmp/taxi_analytics.sql
        ports:
            - "9084:9083"
    pig:
        build:
            context: .
            dockerfile: Dockerfile.pig
        platform: linux/amd64
        hostname: pig
        container_name: taxi-pig
        depends_on:
            - namenode
            - datanode
            - resourcemanager
        volumes:
            - ./hive/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
            - ./hive/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
            - ./hive/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
            - ./hive/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
        stdin_open: true
        tty: true
    # --------------------------------------------------------
    # HBase Service — BDA Project Review 2
    # Standalone Apache HBase 2.4.x with ZooKeeper managed
    # Image: custom hbase_docker (Java 8, HBase 2.4.19, Maven)
    # --------------------------------------------------------
    hbase:
        image: hbase_docker
        platform: linux/amd64
        hostname: hbase
        container_name: hbase
        command: ["bash", "-c", "start-hbase.sh && tail -f /dev/null"]
        environment:
            - HBASE_MANAGES_ZK=true
            - JAVA_HOME=/usr/lib/jvm/java-8
            - HBASE_HOME=/root/hbase-bin
        ports:
            - "16010:16010"   # HBase Master Web UI
            - "16020:16020"   # HBase RegionServer Web UI
            - "2181:2181"     # ZooKeeper client port
            - "16000:16000"   # HBase Master RPC
        volumes:
            - hbase_data:/root/hbase-data
            - ./hbase:/root/nyc-taxi-hbase
        stdin_open: true
        tty: true

volumes:
    taxi_namenode_data:
    taxi_datanode_data:
    hbase_data:
